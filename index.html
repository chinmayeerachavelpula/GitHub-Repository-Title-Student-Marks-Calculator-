<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Marks Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header>
      <h1>Student Marks Calculator</h1>
      <p>Enter marks for five subjects to calculate the total, average, percentage, and grade.</p>
    </header>

    <form id="marksForm">
      <label for="studentName">Student name</label>
      <input id="studentName" type="text" placeholder="Enter student name" required>

      <div class="subjects">
        <div class="subject">
          <label for="maths">Mathematics (out of 100)</label>
          <input id="maths" type="number" min="0" max="100" step="1" required placeholder="0–100">
        </div>
        <div class="subject">
          <label for="science">Science (out of 100)</label>
          <input id="science" type="number" min="0" max="100" step="1" required placeholder="0–100">
        </div>
        <div class="subject">
          <label for="english">English (out of 100)</label>
          <input id="english" type="number" min="0" max="100" step="1" required placeholder="0–100">
        </div>
        <div class="subject">
          <label for="social">Social Studies (out of 100)</label>
          <input id="social" type="number" min="0" max="100" step="1" required placeholder="0–100">
        </div>
        <div class="subject">
          <label for="computer">Computer Science (out of 100)</label>
          <input id="computer" type="number" min="0" max="100" step="1" required placeholder="0–100">
        </div>
      </div>

      <div class="actions">
        <button type="submit">Calculate Results</button>
        <button type="reset" class="secondary" id="resetButton">Clear</button>
      </div>
      <p id="errorMessage" class="error" role="alert"></p>
    </form>

    <section id="results" class="results" aria-live="polite" hidden>
      <h2>Result Summary</h2>
      <p id="resultStudent"></p>
      <div class="result-grid">
        <article><span>Total Marks</span><strong id="total">—</strong><small>/ 500</small></article>
        <article><span>Average</span><strong id="average">—</strong><small>marks per subject</small></article>
        <article><span>Percentage</span><strong id="percentage">—</strong><small>out of 100%</small></article>
        <article><span>Grade</span><strong id="grade">—</strong><small id="status">—</small></article>
      </div>
    </section>

    <footer>Student Marks Calculator · Beginner web development project</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
